services:

  database:
    image: mysql:8.4
    container_name: tb_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-toko_bangunan}
      MYSQL_USER: ${DB_USERNAME:-tb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secretpassword123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tb_backend
    restart: unless-stopped
    environment:
      APP_NAME: "TB Bangun Jaya API"
      APP_ENV: production
      APP_KEY: ${APP_KEY:-base64:/hrBxezQCjDCAANl9VOSDKh8LZ1AvSNWbvdDE82B868=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-toko_bangunan}
      DB_USERNAME: ${DB_USERNAME:-tb_user}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword123}
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tb_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
    driver: local

networks:
  app-network:
    driver: bridge

