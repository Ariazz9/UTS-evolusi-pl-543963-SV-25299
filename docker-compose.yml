services:
  # ===============================================================
  # Service 1: Basis Data MySQL (Soal 6.a & 6.d)
  # Menggunakan named volume 'db_data' agar data persisten
  # ===============================================================
  database:
    image: mysql:8.4
    container_name: tb_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-toko_bangunan}
      MYSQL_USER: ${DB_USERNAME:-tb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secretpassword123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===============================================================
  # Service 2: Backend Laravel dengan FrankenPHP (Soal 6.a, 6.b, Soal 7)
  # Terhubung ke database via hostname service 'database'
  # ===============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tb_backend
    restart: unless-stopped
    environment:
      APP_NAME: "TB Bangun Jaya API"
      APP_ENV: production
      APP_KEY: ${APP_KEY:-base64:/hrBxezQCjDCAANl9VOSDKh8LZ1AvSNWbvdDE82B868=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      # Terhubung melalui nama service di jaringan Docker Compose (Soal 6.b)
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-toko_bangunan}
      DB_USERNAME: ${DB_USERNAME:-tb_user}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword123}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  # ===============================================================
  # Service 3: Frontend Vue.js dengan Nginx (Soal 6.a, 6.b)
  # Menyajikan SPA dan reverse-proxy API ke service 'backend'
  # ===============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tb_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network

# ===============================================================
# Named Volume untuk persistensi data MySQL (Soal 6.d)
# Data tetap aman setelah docker compose down lalu docker compose up -d
# ===============================================================
volumes:
  db_data:
    driver: local

# Jaringan terisolasi antar container (Soal 6.b)
networks:
  app-network:
    driver: bridge

